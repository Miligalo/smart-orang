services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leads_app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - leads_net

  nginx:
    image: nginx:1.25-alpine
    container_name: leads_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - leads_net

  db:
    image: mysql:8.0
    container_name: leads_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: leads_import
      MYSQL_USER: leads
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uleads", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - leads_net

  redis:
    image: redis:7-alpine
    container_name: leads_redis
    restart: unless-stopped
    networks:
      - leads_net

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leads_queue
    restart: unless-stopped
    command: php artisan queue:work redis --sleep=3 --tries=1 --timeout=3600 --memory=256
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - leads_net

networks:
  leads_net:

volumes:
  db_data:
